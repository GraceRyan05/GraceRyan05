<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Grace Ryan, Digital Forensics and Security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#042f3d"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#grid)"/>

    <!-- floating hex "evidence" -->
    <g font-family="'Courier New', monospace" font-size="12" fill="#22d3ee" fill-opacity="0.35">
      <text x="640" y="60">4752 4143 4520 3030</text>
      <text x="700" y="82">0x7f 45 4c 46 02 01</text>
      <text x="610" y="104">SHA256: 9f86d081884c...</text>
      <text x="720" y="126">[ EVIDENCE.IMG ]</text>
      <animate attributeName="fill-opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- scan line -->
    <rect x="0" y="-60" width="900" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;280" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
      <path d="M28 52V28H52"/>
      <path d="M872 52V28H848"/>
      <path d="M28 228V252H52"/>
      <path d="M872 228V252H848"/>
    </g>

    <g font-family="'Courier New', monospace">
      <text x="60" y="62" font-size="14" fill="#22d3ee" letter-spacing="3">CASE FILE // GR-2026 // STATUS: OPEN</text>

      <text x="58" y="148" font-size="62" font-weight="700" fill="url(#name)" letter-spacing="6">GRACE RYAN</text>

      <text x="60" y="184" font-size="17" fill="#cbd5e1" letter-spacing="2">DIGITAL FORENSICS &amp; SECURITY  //  SETU WATERFORD</text>

      <text x="60" y="226" font-size="16" fill="#a78bfa">root@grace:~$</text>
      <text x="170" y="226" font-size="16" fill="#e2e8f0">investigating</text>
      <rect x="285" y="212" width="10" height="18" fill="#22d3ee">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
